<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="socTitle socDesc">
  <title id="socTitle">Flujo de un evento en el SOC</title>
  <desc id="socDesc">Las fuentes generan telemetría, la recolección la centraliza, Wazuh la decodifica y aplica reglas, se genera una alerta y el analista hace triage y respuesta. Las lecciones vuelven a las reglas.</desc>
  <defs>
    <marker id="socArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Flujo de un evento en el SOC</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">De la telemetría a la decisión, con retroalimentación para mejorar las reglas</text>

  <!-- Etapa 1 -->
  <rect x="70" y="130" width="180" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c4a6e">Fuentes</text>
  <text x="160" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0c4a6e">Endpoint · red</text>
  <text x="160" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0c4a6e">nube · aplicación</text>

  <!-- Etapa 2 -->
  <rect x="290" y="130" width="180" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="380" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0c4a6e">Recolección</text>
  <text x="380" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0c4a6e">Agentes · syslog</text>
  <text x="380" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0c4a6e">API</text>

  <!-- Etapa 3 -->
  <rect x="510" y="130" width="180" height="120" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="600" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Wazuh</text>
  <text x="600" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7f1d1d">Decodifica</text>
  <text x="600" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7f1d1d">y aplica reglas</text>

  <!-- Etapa 4 -->
  <rect x="730" y="130" width="180" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="820" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f">Alerta</text>
  <text x="820" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#78350f">Nivel · MITRE</text>
  <text x="820" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#78350f">contexto</text>

  <!-- Etapa 5 -->
  <rect x="950" y="130" width="180" height="120" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1040" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#134e4a">Triage y respuesta</text>
  <text x="1040" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#134e4a">Analista L1/L2</text>
  <text x="1040" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#134e4a">contener · recuperar</text>

  <!-- Flechas -->
  <line x1="254" y1="190" x2="284" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#socArrow)"/>
  <line x1="474" y1="190" x2="504" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#socArrow)"/>
  <line x1="694" y1="190" x2="724" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#socArrow)"/>
  <line x1="914" y1="190" x2="944" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#socArrow)"/>

  <!-- Retroalimentación -->
  <path d="M 1040 250 L 1040 330 L 600 330 L 600 254" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#socArrow)"/>
  <text x="820" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="4" paint-order="stroke">Lecciones y tuning de reglas</text>

  <text x="40" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Cada incidente cerrado vuelve a las reglas, los controles y el entrenamiento del equipo.</text>
</svg>
