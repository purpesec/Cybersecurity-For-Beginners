<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="ptaTitle ptaDesc">
  <title id="ptaTitle">Mapa de vectores de escalada en Linux</title>
  <desc id="ptaDesc">Seis familias de vectores —sudo, SUID y SGID, cron y timers, capabilities, credenciales y kernel o servicios— convergen en root. Cada vector debe validarse y documentarse.</desc>
  <defs>
    <marker id="ptaArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="40" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Mapa de vectores de escalada en Linux</text>
  <text x="40" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Desde una shell limitada hacia root: valida cada vector antes de explotarlo</text>

  <!-- Root -->
  <rect x="490" y="235" width="220" height="105" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="600" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#7f1d1d">root</text>
  <text x="600" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f1d1d">UID 0 · control total</text>

  <!-- Vector 1: sudo -->
  <rect x="110" y="95" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="110" y="95" width="8" height="82" rx="4" fill="#0284c7"/>
  <text x="135" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">sudo mal configurado</text>
  <text x="135" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">NOPASSWD · binarios con escape</text>

  <!-- Vector 2: SUID -->
  <rect x="860" y="95" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="860" y="95" width="8" height="82" rx="4" fill="#0284c7"/>
  <text x="885" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">SUID / SGID</text>
  <text x="885" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">binarios privilegiados</text>

  <!-- Vector 3: cron -->
  <rect x="70" y="240" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="70" y="240" width="8" height="82" rx="4" fill="#0f766e"/>
  <text x="95" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Cron / timers</text>
  <text x="95" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">scripts o directorios escribibles</text>

  <!-- Vector 4: capabilities -->
  <rect x="900" y="240" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="900" y="240" width="8" height="82" rx="4" fill="#0f766e"/>
  <text x="925" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Capabilities</text>
  <text x="925" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">cap_setuid · cap_dac_override</text>

  <!-- Vector 5: credenciales -->
  <rect x="110" y="390" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="110" y="390" width="8" height="82" rx="4" fill="#b45309"/>
  <text x="135" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Credenciales</text>
  <text x="135" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">historial · claves · .env</text>

  <!-- Vector 6: kernel -->
  <rect x="860" y="390" width="230" height="82" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="860" y="390" width="8" height="82" rx="4" fill="#b45309"/>
  <text x="885" y="423" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Kernel / servicios</text>
  <text x="885" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#475569">CVEs · docker · lxd · NFS</text>

  <!-- Flechas -->
  <line x1="340" y1="136" x2="500" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>
  <line x1="860" y1="136" x2="700" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>
  <line x1="300" y1="281" x2="486" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>
  <line x1="900" y1="281" x2="714" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>
  <line x1="340" y1="430" x2="500" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>
  <line x1="860" y1="430" x2="700" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#ptaArrow)"/>

  <text x="40" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">No todos los vectores aplican: confirma permisos, reproduce el hallazgo y documenta el impacto antes de actuar.</text>
</svg>
