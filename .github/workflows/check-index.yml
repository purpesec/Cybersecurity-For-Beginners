name: Check blog index

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  repository_dispatch:
    types: [blog-published]
  push:
    paths:
      - "**/README.md"
      - ".github/scripts/**"
      - ".github/workflows/check-index.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del índice
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # El blog publica su índice de entradas de forma pública, así que la
      # comprobación no necesita tokens ni clonar el repositorio privado.
      - name: Comprobar índices
        run: node .github/scripts/check-index.js https://purpesec.github.io/blog/assets/js/data/search.json
